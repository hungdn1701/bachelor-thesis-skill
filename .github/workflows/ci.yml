name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest moved to 26.04, which has no Python 3.9 build; the skills still promise 3.9.
        os: [ubuntu-24.04, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the optional packages the tests exercise
        run: python -m pip install pyyaml pymupdf
      - name: Run tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests
